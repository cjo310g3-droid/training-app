<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F9462">
  <meta name="description" content="個人體能課表：每週 4 天 × 30 分鐘，打開就是今天要練的內容。">
  <title>體能課表</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-title">體能課表</div>
    <div class="top-progress" id="progress"></div>
  </header>

  <main>
    <section id="view-today" class="view"></section>
    <section id="view-log" class="view" hidden></section>
    <section id="view-settings" class="view" hidden></section>
  </main>

  <nav class="tabs" aria-label="主選單">
    <button class="tab" data-view="today" aria-current="page"><span class="tab-ico">●</span>今天</button>
    <button class="tab" data-view="log"><span class="tab-ico">▦</span>紀錄</button>
    <button class="tab" data-view="settings"><span class="tab-ico">⚙</span>設定</button>
  </nav>

  <div id="timer" class="timer" hidden>
    <div class="timer-label" id="timer-label">休息</div>
    <div class="timer-num" id="timer-num">0:45</div>
    <div class="timer-sub" id="timer-sub"></div>
    <div class="timer-actions">
      <button class="btn ghost" id="timer-plus">+15 秒</button>
      <button class="btn" id="timer-skip">跳過</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="program.js"></script>
  <script src="app.js"></script>
</body>
</html>
